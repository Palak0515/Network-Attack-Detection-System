<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
        }

        /* Left side menu */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: #2a5298;
            padding: 20px;
            box-sizing: border-box;
            color: white;
        }

        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #3d6bb3;
        }

        .logout-btn {
            width: 100%;
            margin-top: 30px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: black;
            color: white;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #d00000;
        }

        /* Main content */
        .main {
            flex: 1;
            padding: 30px;
        }

        .navbar {
            background-color: #2a5298;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
        }

        .hero {
            background-color: white;
            margin-top: 30px;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .hero h1 {
            color: #2a5298;
        }

        .hero p {
            color: #555;
            line-height: 1.5;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 180px;
            padding: 20px;
            background-color: #eef2f7;
            border-radius: 8px;
        }

        .card:hover {
            background-color: #dbeafe;
        }

        .btn {
            margin-top: 25px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #2a5298;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #3d6bb3;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>MENU</h2>

        <a href="/home">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/predict">Predict Attack</a>
        <a href="/upload">Upload CSV</a>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main">

        <div class="navbar">
            <h2>WELCOME</h2>
        </div>

        <div class="hero">
            <h1>NETWORK ATTACK DETECTION SYSTEM</h1>

            <p>
                A system that detects whether network traffic is normal or malicious
                using Machine Learning techniques.
            </p>

            <div class="features">
                <div class="card">Real-Time Detection</div>
                <div class="card">Data Visualization</div>
                <div class="card">ML Powered</div>
                <div class="card">Fast Prediction</div>
            </div>

            <button class="btn" onclick="goDashboard()">
                Go to Dashboard
            </button>
        </div>

    </div>

    <script>
        function logout() {
            window.location.href = "/";
        }

        function goDashboard() {
            window.location.href = "/dashboard";
        }
    </script>

</body>
</html>
