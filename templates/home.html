<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background: #2a5298;
            color: white;
        }

        .sidebar h2 {
            margin: 0 0 25px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            margin: 10px 0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #3d6bb3;
        }

        .logout-btn {
            width: 180px;
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: black;
            color: white;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #d00000;
        }

        .main {
            margin-left: 220px;
            padding: 30px;
        }

        .navbar {
            padding: 12px;
            background: #2a5298;
            color: white;
            text-align: center;
            border-radius: 8px;
        }

        .navbar h2 {
            margin: 0;
        }

        .hero {
            margin-top: 30px;
            padding: 40px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .hero h1 {
            color: #2a5298;
            margin-top: 0;
        }

        .hero p {
            max-width: 700px;
            margin: 15px auto;
            color: #555;
            line-height: 1.5;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 180px;
            padding: 20px;
            background: #eef2f7;
            border-radius: 8px;
        }

        .card:hover {
            background: #dbeafe;
        }

        .btn {
            margin-top: 25px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #2a5298;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: #3d6bb3;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>MENU</h2>

        <a href="/home">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/predict">Predict Attack</a>
        <a href="/upload">Upload CSV</a>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main">

        <div class="navbar">
            <h2>WELCOME</h2>
        </div>

        <div class="hero">
            <h1>NETWORK ATTACK DETECTION SYSTEM</h1>

            <p>
                A system that detects whether network traffic is normal or
                malicious using Machine Learning techniques.
            </p>

            <div class="features">
                <div class="card">Real-Time Detection</div>
                <div class="card">Data Visualization</div>
                <div class="card">ML Powered</div>
                <div class="card">Fast Prediction</div>
            </div>

            <button class="btn" onclick="goDashboard()">
                Go to Dashboard
            </button>
        </div>

    </div>

    <script>
        function logout() {
            window.location.href = "/";
        }

        function goDashboard() {
            window.location.href = "/dashboard";
        }
    </script>

</body>
</html>
