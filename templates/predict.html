<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict Attack</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            background: #2a5298;
            color: white;
        }

        .sidebar h2 {
            margin: 0 0 30px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            margin: 15px 0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .logout-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 180px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: black;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .logout-btn:hover {
            background: red;
        }

        .main {
            margin-left: 220px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 400px;
            padding: 30px 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin: 0 0 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .predict-btn {
            width: 100%;
            margin-top: 5px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #1e90ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #3742fa;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>MENU</h2>

        <a href="/home">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/predict">Predict Attack</a>
        <a href="/upload">Upload CSV</a>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main">
        <div class="form-container">

            <h2>Network Prediction</h2>

            <form action="/predict" method="POST">

                <div class="form-group">
                    <label for="duration">Duration</label>
                    <input type="number" step="any" id="duration"
                           name="duration" required>
                </div>

                <div class="form-group">
                    <label for="src_bytes">Source Bytes</label>
                    <input type="number" step="any" id="src_bytes"
                           name="src_bytes" required>
                </div>

                <div class="form-group">
                    <label for="dst_bytes">Destination Bytes</label>
                    <input type="number" step="any" id="dst_bytes"
                           name="dst_bytes" required>
                </div>

                <div class="form-group">
                    <label for="count">Count</label>
                    <input type="number" step="any" id="count"
                           name="count" required>
                </div>

                <div class="form-group">
                    <label for="same_srv_rate">Same Service Rate</label>
                    <input type="number" step="any" id="same_srv_rate"
                           name="same_srv_rate" required>
                </div>

                <div class="form-group">
                    <label for="serror_rate">Serror Rate</label>
                    <input type="number" step="any" id="serror_rate"
                           name="serror_rate" required>
                </div>

                <div class="form-group">
                    <label for="flag">Flag</label>
                    <select id="flag" name="flag" required>
                        <option value="">Select Flag</option>
                        <option value="0">SF (Successful)</option>
                        <option value="1">S0 (No Response)</option>
                        <option value="2">REJ (Rejected)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="logged_in">Logged In</label>
                    <select id="logged_in" name="logged_in" required>
                        <option value="">Select Status</option>
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <button type="submit" class="predict-btn">Predict</button>

            </form>
        </div>
    </div>

    <script>
        function logout() {
            window.location.href = "/";
        }
    </script>

</body>
</html>
