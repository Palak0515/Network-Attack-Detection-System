<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload CSV</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    background: #f4f6f9;
}

.sidebar {
    width: 220px;
    height: 100vh;
    background: #2a5298;
    color: white;
    padding: 20px;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    position: fixed;
    overflow-y: auto;
}

.sidebar h2 {
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 15px 0;
    padding: 10px;
    border-radius: 6px;
}

.sidebar a:hover {
    background-color: rgba(255,255,255,0.2);
}

.logout-btn {
    background-color: black;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    width: 100%;
    text-align: center;
}
.logout-btn:hover {
    background-color: red;
    color: white;
}

    .main {
        flex: 1;
        padding: 20px;
        padding-left: 15%;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
    }
    .navbar h2 {
    padding-left: 41%;
    }

    /* Upload Box */
    .upload-box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        text-align: center;
        width: 500px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .upload-box input {
        margin: 20px 0;
    }

    .btn {
        padding: 10px 20px;
        border: none;
        background: #2a5298;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .btn:hover {
        background: #1e3c72;
    }

.table {
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    overflow-x: auto;
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th {
    background: #2a5298;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

tr:nth-child(even) {
    background: #f8f9fc;
}

tr:hover {
    background: #e6ecff;
    transition: 0.3s;
}
    .m2 {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 60px;
}
</style>
</head>

<body>

<div class="sidebar">
    <div>
        <h2>MENU</h2>
        <a href="/home">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/predict">Predict Attack</a>
        <a href="/upload">Upload CSV</a>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="main">
    <div class="navbar">
        <h2>UPLOAD CSV</h2>
    </div>
<div class="m2">
    <div class="upload-box">
        <h2>Select CSV File</h2>
        <input type="file" id="fileInput" accept=".csv">
        <br>
        <button class="btn" onclick="uploadFile()">Upload</button>
    </div>
</div>

    <div class="table">
        <table id="csvTable">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>
    function logout() {
        window.location.href = "/";
    }

function uploadFile() {
    let file = document.getElementById("fileInput").files[0];

    if (!file) {
        alert("Please select a file!");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    fetch("/upload_csv", {
        method: "POST",
        body: formData
    })
    .then(response => response.text())
    .then(data => {
        let tableDiv = document.querySelector(".table");
        tableDiv.style.display = "block";
        tableDiv.innerHTML = "<h3><center>PREDICTION RESULTS</center></h3>" + data;
    })
    .catch(error => {
        console.error("Error:", error);
    });
}
</script>
</body>
</html>
