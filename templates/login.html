<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #2a5298;
        }

        .login-box {
            width: 300px;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        .input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-button {
            width: 100%;
            padding: 10px;
            background-color: #2a5298;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #1e3c72;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>

        <input type="text" id="username" class="input" placeholder="Enter ID">

        <input type="password" id="password" class="input" placeholder="Enter Password">

        <button class="login-button" onclick="login()">Login</button>
    </div>

    <script>
        function login() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (username == "xxxxx" && password == "x1234") {
                window.location.href = "/home";
            } else {
                alert("Invalid ID or Password");
            }
        }
    </script>

</body>
</html>
